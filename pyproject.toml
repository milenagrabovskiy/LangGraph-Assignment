[project]
name = "ticket-assistant"
version = "0.1.0"
description = "A support-ticket assistant built on Amazon Bedrock's Converse API."
requires-python = ">=3.11"
dependencies = [
    "boto3>=1.34",
    "python-dotenv>=1.0",
    "langgraph==1.2.11",
    "langchain-aws==1.7.8",
    "langchain-text-splitters==1.1.2",
    "state>=0.1.1.dev0",
    "annotated>=0.0.2",
]

[project.optional-dependencies]
dev = [
    "pytest==9.1.1",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["ticket_assistant*"]
